<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">EF Game Frontend Navigation</title>
  <desc id="desc">Frontend navigation organized by main flow and feature groups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbf5" /><stop offset="1" stop-color="#eef5fb" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#27445c" flood-opacity=".13" /></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526779" /></marker>
    <style>
      text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#24394a}.title{font-size:34px;font-weight:800}.subtitle{font-size:15px;fill:#627787}.section{font-size:20px;font-weight:800}.stageNo{font-size:13px;font-weight:800;fill:#fff}.nodeTitle{font-size:17px;font-weight:800}.route{font-size:11px;fill:#657887}.body{font-size:12px;fill:#536a79}.small{font-size:10.5px;fill:#6a7d8b}.box{stroke-width:1.8;filter:url(#shadow)}.entry{fill:#fff9e8;stroke:#d7af45}.child{fill:#edf9ef;stroke:#61a66e}.train{fill:#edf5ff;stroke:#5d91c6}.test{fill:#f5efff;stroke:#8a6cc0}.result{fill:#fff3eb;stroke:#d68154}.clinical{fill:#ecf9f7;stroke:#429991}.utility{fill:#f3f5f7;stroke:#8496a3}.warn{fill:#fff1f0;stroke:#c85851;stroke-dasharray:6 4}.lane{fill:#fff;fill-opacity:.52;stroke:#cbd8df;stroke-width:1.4}.flow{fill:none;stroke:#526779;stroke-width:2.4;marker-end:url(#arrow)}.divider{stroke:#d4dfe5;stroke-width:1.2}.pill{fill:#526779}
    </style>
  </defs>
  <rect width="1600" height="1180" fill="url(#bg)" />
  <text x="55" y="56" class="title">EF Game Frontend Navigation</text>
  <text x="55" y="84" class="subtitle">Main flow, six task groups, results, and professional workspaces with their routes.</text>

  <rect class="lane" x="40" y="112" width="1520" height="185" rx="23" /><text x="62" y="145" class="section">A. Entry and identity</text>
  <g><rect class="box entry" x="90" y="180" width="200" height="82" rx="17" /><circle class="pill" cx="116" cy="203" r="15" /><text x="116" y="208" text-anchor="middle" class="stageNo">1</text><text x="190" y="208" text-anchor="middle" class="nodeTitle">Home</text><text x="190" y="234" text-anchor="middle" class="route">/</text></g>
  <g><rect class="box entry" x="380" y="168" width="220" height="106" rx="17" /><circle class="pill" cx="406" cy="192" r="15" /><text x="406" y="197" text-anchor="middle" class="stageNo">2</text><text x="490" y="197" text-anchor="middle" class="nodeTitle">Family account</text><text x="490" y="225" text-anchor="middle" class="route">/login</text><text x="490" y="250" text-anchor="middle" class="route">/register</text></g>
  <g><rect class="box clinical" x="1230" y="180" width="280" height="82" rx="17" /><text x="1370" y="208" text-anchor="middle" class="nodeTitle">Professional login</text><text x="1370" y="234" text-anchor="middle" class="route">/clinician-login</text></g>
  <path class="flow" d="M290 221H380" /><path class="flow" d="M290 208C650 130 980 130 1230 208" />
  <text x="755" y="158" text-anchor="middle" class="body">Choose the family or professional entry on the home page</text>

  <rect class="lane" x="40" y="320" width="1520" height="210" rx="23" /><text x="62" y="353" class="section">B. Child workflow</text>
  <g><rect class="box child" x="80" y="395" width="250" height="92" rx="17" /><circle class="pill" cx="106" cy="419" r="15" /><text x="106" y="424" text-anchor="middle" class="stageNo">3</text><text x="205" y="420" text-anchor="middle" class="nodeTitle">Select / add child</text><text x="205" y="448" text-anchor="middle" class="route">/child-select · /add-patient</text><text x="205" y="471" text-anchor="middle" class="small">Return to switch child</text></g>
  <g><rect class="box child" x="410" y="395" width="220" height="92" rx="17" /><circle class="pill" cx="436" cy="419" r="15" /><text x="436" y="424" text-anchor="middle" class="stageNo">4</text><text x="520" y="420" text-anchor="middle" class="nodeTitle">Choose mode</text><text x="520" y="448" text-anchor="middle" class="route">/mode-select</text><text x="520" y="471" text-anchor="middle" class="small">Training / assessment</text></g>
  <g><rect class="box train" x="710" y="395" width="250" height="92" rx="17" /><circle class="pill" cx="736" cy="419" r="15" /><text x="736" y="424" text-anchor="middle" class="stageNo">5A</text><text x="835" y="420" text-anchor="middle" class="nodeTitle">Training / game menu</text><text x="835" y="448" text-anchor="middle" class="route">/game-menu</text><text x="835" y="471" text-anchor="middle" class="small">Resume and adaptive recommendations</text></g>
  <g><rect class="box test" x="1040" y="395" width="250" height="92" rx="17" /><circle class="pill" cx="1066" cy="419" r="15" /><text x="1066" y="424" text-anchor="middle" class="stageNo">5B</text><text x="1165" y="420" text-anchor="middle" class="nodeTitle">Assessment map</text><text x="1165" y="448" text-anchor="middle" class="route">/test-map</text><text x="1165" y="471" text-anchor="middle" class="small">Unlock progress and sequential tasks</text></g>
  <g><rect class="box utility" x="1360" y="395" width="150" height="92" rx="17" /><text x="1435" y="420" text-anchor="middle" class="nodeTitle" textLength="126" lengthAdjust="spacingAndGlyphs">Shared settings</text><text x="1435" y="447" text-anchor="middle" class="route">/settings</text><text x="1435" y="470" text-anchor="middle" class="small" textLength="126" lengthAdjust="spacingAndGlyphs">Music / audio / display</text></g>
  <path class="flow" d="M330 441H410" /><path class="flow" d="M630 441H710" /><path class="flow" d="M960 441H1040" />

  <rect class="lane" x="40" y="555" width="1520" height="300" rx="23" /><text x="62" y="588" class="section">C. Six executive-function tasks shared by assessment and training</text>
  <g><rect class="box train" x="75" y="630" width="225" height="175" rx="17" /><text x="187" y="661" text-anchor="middle" class="nodeTitle">SRT Reaction task</text><text x="187" y="687" text-anchor="middle" class="body" textLength="201" lengthAdjust="spacingAndGlyphs">Inhibition / reaction speed</text><line class="divider" x1="98" y1="705" x2="277" y2="705" /><text x="187" y="731" text-anchor="middle" class="route">/training-srt</text><text x="187" y="756" text-anchor="middle" class="route">/test-srt</text><text x="187" y="781" text-anchor="middle" class="route">/result-srt</text></g>
  <g><rect class="box train" x="320" y="630" width="225" height="175" rx="17" /><text x="432" y="661" text-anchor="middle" class="nodeTitle">PM Picture memory</text><text x="432" y="687" text-anchor="middle" class="body">Working memory</text><line class="divider" x1="343" y1="705" x2="522" y2="705" /><text x="432" y="731" text-anchor="middle" class="route">/training-picture-memory</text><text x="432" y="756" text-anchor="middle" class="route">/test-picture-memory</text><text x="432" y="781" text-anchor="middle" class="route">/result-picture-memory</text></g>
  <g><rect class="box train" x="565" y="630" width="225" height="175" rx="17" /><text x="677" y="661" text-anchor="middle" class="nodeTitle">CBT Block sequence</text><text x="677" y="687" text-anchor="middle" class="body">Spatial working memory</text><line class="divider" x1="588" y1="705" x2="767" y2="705" /><text x="677" y="731" text-anchor="middle" class="route">/training-cbt</text><text x="677" y="756" text-anchor="middle" class="route">/test-cbt</text><text x="677" y="781" text-anchor="middle" class="route">/result-cbt</text></g>
  <g><rect class="box train" x="810" y="630" width="225" height="175" rx="17" /><text x="922" y="661" text-anchor="middle" class="nodeTitle">SSG Sound rules</text><text x="922" y="687" text-anchor="middle" class="body">Inhibition / opposite rule</text><line class="divider" x1="833" y1="705" x2="1012" y2="705" /><text x="922" y="731" text-anchor="middle" class="route">/training-ssg</text><text x="922" y="756" text-anchor="middle" class="route">/test-ssg</text><text x="922" y="781" text-anchor="middle" class="route">/result-ssg</text></g>
  <g><rect class="box train" x="1055" y="630" width="225" height="175" rx="17" /><text x="1167" y="661" text-anchor="middle" class="nodeTitle">LB Linking task</text><text x="1167" y="687" text-anchor="middle" class="body" textLength="201" lengthAdjust="spacingAndGlyphs">Attention shifting / ordering</text><line class="divider" x1="1078" y1="705" x2="1257" y2="705" /><text x="1167" y="731" text-anchor="middle" class="route">/training-linking-balloons</text><text x="1167" y="756" text-anchor="middle" class="route">/test-linking-balloons</text><text x="1167" y="781" text-anchor="middle" class="route">/result-lb</text></g>
  <g><rect class="box train" x="1300" y="630" width="225" height="175" rx="17" /><text x="1412" y="661" text-anchor="middle" class="nodeTitle">DCCS Card sorting</text><text x="1412" y="687" text-anchor="middle" class="body">Cognitive flexibility</text><line class="divider" x1="1323" y1="705" x2="1502" y2="705" /><text x="1412" y="731" text-anchor="middle" class="route">/training-dccs</text><text x="1412" y="756" text-anchor="middle" class="route">/test-dccs</text><text x="1412" y="781" text-anchor="middle" class="route">/result-dccs</text></g>
  <text x="800" y="827" text-anchor="middle" class="body">Shared flow: instructions · response and timing · feedback · scoring · save trials and results</text>
  <text x="800" y="846" text-anchor="middle" class="small">Compatible routes: /training-dcss · /training-Dcss · /training-DCCS · /test-Dcss · /test-DCCS · /result-DCCS</text>

  <rect class="lane" x="40" y="880" width="760" height="245" rx="23" /><text x="62" y="913" class="section">D. Results, rewards, and return paths</text>
  <g><rect class="box result" x="80" y="945" width="210" height="140" rx="17" /><text x="185" y="975" text-anchor="middle" class="nodeTitle">Task results</text><text x="185" y="1002" text-anchor="middle" class="body">Accuracy, RT, and stars</text><text x="185" y="1027" text-anchor="middle" class="route">Six /result-* routes</text><text x="185" y="1051" text-anchor="middle" class="route" textLength="186" lengthAdjust="spacingAndGlyphs">/result · /result-pa · /result-dc</text><text x="185" y="1074" text-anchor="middle" class="route" textLength="186" lengthAdjust="spacingAndGlyphs">/result-ch (combined results)</text></g>
  <g><rect class="box result" x="320" y="955" width="200" height="120" rx="17" /><text x="420" y="985" text-anchor="middle" class="nodeTitle" textLength="176" lengthAdjust="spacingAndGlyphs">Hat and sticker game</text><text x="420" y="1012" text-anchor="middle" class="route">/hat-sticker-game</text><text x="420" y="1038" text-anchor="middle" class="body">Rewards and collection</text></g>
  <g><rect class="box child" x="550" y="955" width="210" height="120" rx="17" /><text x="655" y="985" text-anchor="middle" class="nodeTitle">Achievements / room</text><text x="655" y="1012" text-anchor="middle" class="route">/achievement</text><text x="655" y="1037" text-anchor="middle" class="route">/avatar-room · /furniture</text><text x="655" y="1061" text-anchor="middle" class="body" textLength="186" lengthAdjust="spacingAndGlyphs">Return to /game-menu or /test-map</text></g>
  <path class="flow" d="M290 1015H320" /><path class="flow" d="M520 1015H550" />

  <rect class="lane" x="825" y="880" width="735" height="245" rx="23" /><text x="847" y="913" class="section">E. Clinical and research dashboard navigation</text>
  <g><rect class="box clinical" x="860" y="950" width="205" height="132" rx="17" /><text x="962" y="981" text-anchor="middle" class="nodeTitle">Clinical dashboard</text><text x="962" y="1007" text-anchor="middle" class="route">/clinician-dashboard</text><text x="962" y="1033" text-anchor="middle" class="route">/add-patient</text><text x="962" y="1059" text-anchor="middle" class="small" textLength="181" lengthAdjust="spacingAndGlyphs">Cases, assessments, notes, reminders</text></g>
  <g><rect class="box clinical" x="1090" y="950" width="205" height="132" rx="17" /><text x="1192" y="981" text-anchor="middle" class="nodeTitle">Analysis and AI</text><text x="1192" y="1007" text-anchor="middle" class="route">/research-statistics</text><text x="1192" y="1033" text-anchor="middle" class="route">/ai-behavioral-analysis</text><text x="1192" y="1059" text-anchor="middle" class="small" textLength="181" lengthAdjust="spacingAndGlyphs">Statistics, predictions, explanations</text></g>
  <g><rect class="box clinical" x="1320" y="950" width="205" height="132" rx="17" /><text x="1422" y="981" text-anchor="middle" class="nodeTitle">Research workspace</text><text x="1422" y="1007" text-anchor="middle" class="route" textLength="181" lengthAdjust="spacingAndGlyphs">/adaptive-recommendation-research</text><text x="1422" y="1033" text-anchor="middle" class="route">/longitudinal-dashboard</text><text x="1422" y="1057" text-anchor="middle" class="route" textLength="181" lengthAdjust="spacingAndGlyphs">/research-professional-dashboard</text></g>
  <path class="flow" d="M1065 1016H1090" /><path class="flow" d="M1295 1016H1320" />

  <text x="55" y="1155" class="small">Implementation: /rest is registered; TrainingMapPage.jsx exists, but /training-map is not registered. Unmatched routes return home.</text>
</svg>